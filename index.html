<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Win Tickets to Google Cloud Next 2026 | Cloud Latitude</title>
    <meta name="description" content="Book a free 10-minute Cloud Intel Brief with Cloud Latitude and enter to win conference passes, hotel stays, and flights to Google Cloud Next 2026 in Las Vegas." />
    <!-- Self-hosted fonts: served from Cloudflare edge -->
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Cal.com embed loads when user scrolls to booking section -->
    <link rel="dns-prefetch" href="https://app.cal.com">

    <!-- WebMCP JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "Cloud Latitude Google Cloud Next 2026 Raffle",
      "description": "Book a free 10-minute Cloud Intel Brief with Cloud Latitude. Every completed booking enters you to win conference passes, hotel stays, and flights to Google Cloud Next 2026 in Las Vegas.",
      "startDate": "2026-02-16",
      "endDate": "2026-03-13",
      "eventAttendanceMode": "https://schema.org/OnlineEventAttendanceMode",
      "location": {
        "@type": "VirtualLocation",
        "url": "https://cloudlatitude.io"
      },
      "organizer": {
        "@type": "Organization",
        "name": "Cloud Latitude",
        "url": "https://cloudlatitude.com"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "validFrom": "2026-02-16",
        "validThrough": "2026-03-13"
      },
      "potentialAction": {
        "@type": "RegisterAction",
        "name": "Enter Raffle",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://cloudlatitude.io/gcn-2026#booking",
          "actionPlatform": ["http://schema.org/DesktopWebPlatform", "http://schema.org/MobileWebPlatform"]
        }
      }
    }
    </script>

    <!-- Agent Discovery -->
    <link rel="agent-card" href="/.well-known/agent-card.json" type="application/json" />
    <link rel="agent" href="/.well-known/agent.json" type="application/json" />
    <link rel="llms" href="/llms.txt" type="text/plain" />
    <meta name="ai-agent-discovery" content="enabled" />
    <meta name="agent-card" content="/.well-known/agent-card.json" />
    <meta name="llms-txt" content="/llms.txt" />
    <meta name="a2a-endpoint" content="/a2a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Cloudflare Web Analytics -->
    <!-- TODO: Replace YOUR_BEACON_TOKEN with your actual token from:
         Cloudflare Dashboard → Web Analytics → Add Site → cloudlatitude.io → Copy JS snippet -->
    <!-- <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "YOUR_BEACON_TOKEN"}'></script> -->
  </body>
</html>
